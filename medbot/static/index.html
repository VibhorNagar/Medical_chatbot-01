<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedBot – Medical Encyclopedia Assistant</title>
<style>
  :root{--bg:#f4f7fb;--card:#fff;--ink:#1d2733;--muted:#6b7a8c;--brand:#0f766e;--brand2:#14b8a6;--line:#e1e8f0;--warn:#fef3c7;--warnink:#92400e;--emg:#fee2e2;--emgink:#991b1b}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--ink:#e6edf5;--muted:#8fa0b3;--line:#27364a;--warn:#3b2f12;--warnink:#fcd34d;--emg:#451a1a;--emgink:#fca5a5}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0}header small{opacity:.85}
  #chat{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:12px 0;display:flex}.msg.user{justify-content:flex-end}
  .bubble{max-width:88%;padding:12px 14px;border-radius:14px;line-height:1.5;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .user .bubble{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bubble h3{margin:0 0 6px;font-size:16px;color:var(--brand)}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px;font-weight:600}
  .page{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{border:1px solid var(--brand);color:var(--brand);background:transparent;padding:4px 10px;border-radius:999px;font-size:13px;cursor:pointer}
  .chip:hover{background:var(--brand);color:#fff}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .alert{background:var(--emg);color:var(--emgink);padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:14px}
  .welcome{background:var(--warn);color:var(--warnink)}
  form{display:flex;gap:8px;padding:12px 20px 18px;max-width:820px;width:100%;margin:0 auto}
  input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;outline:none}
  input:focus{border-color:var(--brand2)}
  button.send{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0 20px;font-size:15px;cursor:pointer}
  .typing{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header><div style="font-size:26px">🩺</div><div><h1>MedBot</h1><small>Answers from the Gale Encyclopedia of Medicine</small></div></header>
<div id="chat"></div>
<form id="f" autocomplete="off">
  <input id="q" placeholder="Ask about a condition, symptom, test or treatment…" autofocus>
  <button class="send">Send</button>
</form>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q');
let lastTopic=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function add(html,who='bot',cls=''){const m=document.createElement('div');m.className='msg '+who;m.innerHTML=`<div class="bubble ${cls}">${html}</div>`;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m}
function chips(list,fn){return '<div class="chips">'+list.map(t=>`<button class="chip" data-q="${esc(fn(t))}">${esc(t)}</button>`).join('')+'</div>'}
chat.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)ask(b.dataset.q)});
add(`<b>Hi! I'm MedBot.</b> Ask me things like “symptoms of bronchitis”, “what is acne?” or “how is bulimia nervosa treated?”.<br><span class="note">General information only – not a substitute for a doctor. In an emergency call your local emergency number.</span>${chips(['What is asthma?','Symptoms of bronchitis','Treatment for burns','Prevent anthrax'],t=>t)}`,'bot','welcome');
async function ask(text){
  text=text.trim();if(!text)return;q.value='';
  add(esc(text),'user');
  const t=add('<span class="typing">Searching the book…</span>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,last_topic:lastTopic})});
    const d=await r.json();t.remove();
    let h='';
    if(d.emergency)h+='<div class="alert">⚠️ If this is a medical emergency, call your local emergency number now.</div>';
    if(d.parts){
      lastTopic=d.topic;
      h+=`<h3>${esc(d.topic)}</h3>`;
      d.parts.forEach(p=>h+=`<div class="sec">${esc(p.section)} <span class="page">· book p. ${p.page}</span></div><div>${esc(p.text)}</div>`);
      const others=(d.sections||[]).filter(s=>!d.parts.some(p=>p.section===s));
      if(others.length)h+=`<div class="sec">More about ${esc(d.topic)}</div>`+chips(others,s=>`${s} of ${d.topic}`);
      if(d.related&&d.related.length)h+=`<div class="sec">Related topics</div>`+chips(d.related,t=>`What is ${t}?`);
    }else h+=esc(d.answer||d.error||'Something went wrong.');
    if(d.disclaimer)h+=`<div class="note">${esc(d.disclaimer)}</div>`;
    add(h);
  }catch(e){t.remove();add('Could not reach the server. Is it running?')}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();ask(q.value)});
</script>
</body>
</html>
